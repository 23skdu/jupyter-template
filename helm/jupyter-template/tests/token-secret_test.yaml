suite: token secret
templates:
  - token-secret.yaml
release:
  name: rel
  namespace: ns
tests:
  - it: creates the Secret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: rel-jupyter-template

  - it: generates a 48 character token when none is supplied
    asserts:
      - matchRegex:
          path: stringData.token
          pattern: ^[A-Za-z0-9]{48}$

  - it: honours an explicit token value
    set:
      token.value: my-secret-token
    asserts:
      - equal:
          path: stringData.token
          value: my-secret-token

  - it: quotes the token so YAML special characters survive
    set:
      token.value: "abc: 123 #not-a-comment"
    asserts:
      - equal:
          path: stringData.token
          value: "abc: 123 #not-a-comment"

  - it: does not create the Secret when create is false
    set:
      token.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the Secret when an existing one is referenced
    set:
      token.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders annotations on the Secret
    set:
      token.annotations:
        helm.sh/resource-policy: keep
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: carries the standard labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: jupyter-template
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: rel