apiVersion: v2
name: jupyter-template
description: A Helm chart that runs a JupyterLab + Apache Spark notebook server on Kubernetes.
home: https://github.com/23skdu/jupyter-template
icon: https://jupyter.org/assets/notebook-icon.png
sources:
  - https://github.com/23skdu/jupyter-template
keywords:
  - jupyter
  - jupyterlab
  - spark
  - pyspark
  - notebook
  - datascience
maintainers:
  - name: 23skdu
    url: https://github.com/23skdu
type: application

# Chart version. Bump on every change to the chart or its templates.
# Follows Semantic Versioning: https://semver.org/
version: 0.2.0

# Version of the application being deployed. This defaults to the image tag,
# which tracks the Jupyter Docker Stacks release the image is built from.
appVersion: "2026-09-29"

# autoscaling/v2 (HPA) requires Kubernetes >= 1.23. Gateway API v1 HTTPRoutes
# are optional and additionally require the Gateway API CRDs.
kubeVersion: ">=1.27.0-0"
