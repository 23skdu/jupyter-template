suite: service account
templates:
  - serviceaccount.yaml
release:
  name: rel
  namespace: ns
tests:
  - it: creates a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: rel-jupyter-template

  - it: does not automount the API token by default
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: automounts the token when opted in
    set:
      serviceAccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: is not created when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honours an explicit name
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: honours a name when creation is disabled
    set:
      serviceAccount.create: false
      serviceAccount.name: external-sa
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders annotations
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/jupyter
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/jupyter

  - it: carries the standard labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: rel