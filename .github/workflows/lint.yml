name: Lint

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docker:
    name: Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hadolint
        # Passes with no ignores: the upstream Jupyter image already installs
        # every runtime dependency and sets up an apt post-invoke cleanup hook,
        # so this Dockerfile deliberately adds no OS packages of its own.
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  lint-helm:
    name: Helm ${{ matrix.helm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Render and test against both supported major versions: Helm 4 is
        # current, Helm 3 is what most clusters' tooling still runs.
        # pluginArgs differs because Helm 4 verifies plugin signatures by
        # default and cannot do that from a git checkout.
        include:
          - helm: v3.22.0
            pluginArgs: ""
          - helm: v4.3.0
            pluginArgs: "--verify=false"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}

      - name: Install helm-unittest plugin
        # Installed from git rather than the oci:// artifact: the OCI path needs
        # either Helm's OCI plugin support or a ghcr.io token, whereas git works
        # on both majors. https://github.com/helm-unittest/helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git ${{ matrix.pluginArgs }}

      - name: helm version
        run: helm version

      - name: Helm lint
        run: helm lint helm/jupyter-template --strict

      - name: Helm template (default values)
        run: helm template ci helm/jupyter-template --namespace ci > /dev/null

      - name: Helm template (all features enabled)
        # Values live in tests/values-all-features.yaml so this step and
        # `make -C tests render-all` exercise the same branches.
        run: helm template ci helm/jupyter-template --namespace ci -f tests/values-all-features.yaml > /dev/null

      - name: Helm unittest
        run: helm unittest helm/jupyter-template --strict

  lint-yaml:
    name: YAML and workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          # The rules live in .yamllint at the repo root so this job and
          # `make -C tests lint-yaml` cannot drift apart. Note this action has
          # config_file / config_data inputs but no plain `config` input: an
          # unknown key is only a warning, and yamllint then silently falls back
          # to the default ruleset.
          config_file: .yamllint
          strict: true

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
