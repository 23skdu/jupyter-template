{{- if and .Values.token.create (not .Values.token.existingSecret) }}
{{- $fullName := include "jupyter-template.fullname" . -}}
{{- $token := .Values.token.value -}}
{{- if not $token -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $fullName -}}
  {{- if and $existing $existing.data -}}
    {{- $token = index $existing.data "token" | b64dec -}}
  {{- else -}}
    {{- $token = (randAlphaNum 48) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "jupyter-template.labels" . | nindent 4 }}
  {{- with .Values.token.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}