{{- if .Values.testConnection.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "jupyter-template.fullname" . }}-test-connection"
  labels:
    {{- include "jupyter-template.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command:
        - wget
      args:
        # --spider on busybox issues a GET (GNU wget would use HEAD, which
        # Jupyter answers with 405) and skips writing the body.
        - "--spider"
        # The image sets GEN_CERT=yes, so the server speaks HTTPS with a
        # self-signed certificate. Verification is off because there is nothing
        # to verify against; this only proves the port is serving.
        - "--no-check-certificate"
        - "{{ .Values.testConnection.scheme }}://{{ include "jupyter-template.fullname" . }}:{{ .Values.service.port }}/"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
  restartPolicy: Never
{{- end }}